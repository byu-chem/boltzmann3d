name: Java 25 desktop build

on:
  push:
    branches: [main, 'modernize/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
            artifact: macos-arm64
          - os: windows-2022
            arch: x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: ${{ matrix.arch }}
      - name: Install Ant on macOS
        if: runner.os == 'macOS'
        run: brew install ant
      - name: Install Ant on Windows
        if: runner.os == 'Windows'
        run: choco install ant --no-progress --yes
      - name: Build and check settings and physics
        shell: bash
        run: ant -noinput clean test dist 2>&1 | tee build.log
      - name: Check macOS rendering pixels
        if: runner.os == 'macOS'
        shell: bash
        run: ant -noinput test-render 2>&1 | tee -a build.log
      - name: Install WiX for the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixTools = Join-Path $env:RUNNER_TEMP 'boltzmann-wix'
          dotnet tool install wix --tool-path $wixTools --version 5.0.2 2>&1 | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          & (Join-Path $wixTools 'wix.exe') extension add --global WixToolset.UI.wixext/5.0.2 2>&1 | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed' }
          & (Join-Path $wixTools 'wix.exe') extension add --global WixToolset.Util.wixext/5.0.2 2>&1 | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { throw 'WiX utility extension installation failed' }
          $wixTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package and verify the Mac app and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: nice -n 10 ant -noinput package-verified 2>&1 | tee -a build.log
      - name: Package and verify the Windows app and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'build.log'
          $errorLog = Join-Path $env:GITHUB_WORKSPACE 'build.err'
          $process = Start-Process -FilePath $env:ComSpec `
            -ArgumentList @('/c', 'ant -noinput package') `
            -PriorityClass BelowNormal -PassThru -Wait -NoNewWindow `
            -RedirectStandardOutput $buildLog -RedirectStandardError $errorLog
          if (Test-Path $errorLog) {
            Get-Content $errorLog | Add-Content $buildLog
          }
          Get-Content $buildLog
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Verify Windows installation and uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/installers/*.exe | Select-Object -First 1
          & ./packaging/verify-windows-install.ps1 -Installer $installer.FullName 2>&1 | Tee-Object -FilePath build.log -Append
      - name: Attach compiler diagnostics to the commit checks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('build.log')) return;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              name: 'Build diagnostics (${{ matrix.artifact }})',
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Ant build output',
                summary: '```text\n' + fs.readFileSync('build.log', 'utf8').slice(-60000) + '\n```'
              }
            });
      - uses: actions/upload-artifact@v4
        with:
          name: Boltzmann3D-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Boltzmann3D-${{ matrix.artifact }}-installer
          path: packages/installers/
          if-no-files-found: error

name: Java 25 desktop build

on:
  push:
    branches: [main, 'modernize/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
            artifact: macos-arm64
          - os: windows-2022
            arch: x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: ${{ matrix.arch }}
      - name: Install Ant on macOS
        if: runner.os == 'macOS'
        run: brew install ant
      - name: Install Ant on Windows
        if: runner.os == 'Windows'
        run: choco install ant --no-progress --yes
      - name: Build and check settings and physics
        shell: bash
        run: ant -noinput clean test dist 2>&1 | tee build.log
      - name: Check macOS rendering pixels
        if: runner.os == 'macOS'
        shell: bash
        run: ant -noinput test-render 2>&1 | tee -a build.log
      - name: Attach compiler diagnostics to the commit checks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('build.log')) return;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              name: 'Build diagnostics (${{ matrix.artifact }})',
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Ant build output',
                summary: '```text\n' + fs.readFileSync('build.log', 'utf8').slice(-60000) + '\n```'
              }
            });
      - uses: actions/upload-artifact@v4
        with:
          name: Boltzmann3D-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
